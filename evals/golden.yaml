# Golden release set: RiverGuide 2.0
#
# Converted from RiverGuide 1's tests/evals/golden.yaml (53 items, 2026-08-20)
# so the two designs are graded on the same questions. Every answer check
# (must_contain / must_not_contain / expected_summary) is unchanged. Only the
# retrieval checks changed, because v2 has three tools instead of twelve:
#
#   must_call_tool: get_deadline, get_fee, ...  ->  must_ground: true
#       (answer only after search, read_page, or search_sections)
#   must_call_tool: search_sections             ->  unchanged
#   must_cite_page: wiki/...md                  ->  must_cite_url: [...]
#       (link one of the official pages that wiki page was compiled from)
#   must_not_call_tool: any | search_sections   ->  unchanged
#   must_not_call_tool: search_courses          ->  dropped (no such tool)
#
# Each item's notes end with the v1 check it replaces.

